# Example. Not in force while it sits in `examples/`: nothing in this folder is read as a hook. Copy the hooks you want into `hooks.yml` in the hooks folder (`.hooks/` for every chat, `hooks/` in one chat's own files) to switch them on.
#
# A hook is a command of yours, run as you at its moment: its `name`, its `command` exactly as you would type it (it is run by the shell, so give a script's whole path), and a `timeout` in seconds where it needs a different one from the setting hooks.timeoutSeconds. The hooks of a moment run one after another, the farthest level's first and each file in its written order; one in a nearer level with the name of a farther one replaces it, and `hooks/<name>` in the config's `stack.off` list switches one off. A hook runs only once the host has switched commands on for you.
#
# What a hook is given: the moment's JSON on its standard input. It always holds `hook` (the hook's own name) and `event` (the moment), and, where the moment has them, the run's `scope` and the `agent` it runs for; what else it holds is written under each moment below.
# What a hook answers, as JSON on its standard output:
#   {"decision": "block", "reason": "..."}  stops what was about to happen and tells why
#   {"context": "..."}                      adds a line to what is told next
#   {"input": {...}}                        before a tool only: the arguments the call is to go with
# A hook that exits with the code hooks.blockExit (2 as shipped) blocks too, and what it wrote on its standard error is the reason. Any other failure, an answer longer than hooks.maxAnswerBytes, or running past its timeout blocks nothing; the Files page shows what happened.

# At a turn's start, before the agent's first call. Also given `turn` (its kind and its lead). What `context` says is shown to the lead in its briefing, under what your hooks added.
turn-start:
  - name: say-the-hour
    command: sh /path/to/say-the-hour.sh

# Before each tool call, for any agent. Also given `tool`, `callId` and `args`. A block stops the call and the agent is told the reason; `input` changes the arguments it goes with. This is the hook that refuses a write with no source: see check-source.sh beside this file.
before-tool:
  - name: sourced-writes
    command: sh /path/to/check-source.sh
    timeout: 10

# After each tool call. Also given `tool`, `callId`, `args` and `result`, the answer's `text` and `error` where it was one. A block is shown to the agent in place of the answer's own words (the whole answer is kept); `context` adds a line after them.
after-tool:
  - name: log-calls
    command: sh /path/to/log-call.sh

# When the reply is about to go to the chat, and once it has gone. Before it goes, a hook is given `reply`, `{form, text, by}`, the reply as it was written; nothing shows until the hook has seen it whole, and a block keeps it back: the agent gets the reason and writes the reply again. After it has gone, a hook is given `release`, `{form, text, by}` in the same shape, and `context` goes to the lead's run.
before-release:
  - name: check-the-reply
    command: sh /path/to/check-reply.sh
after-release:
  - name: tell-the-phone
    command: sh /path/to/notify.sh

# When an agent's run would end. A block gives the agent the reason to go on with, for one more call.
run-end:
  - name: nothing-left-open
    command: sh /path/to/check-todos.sh

# When a session closes. Given `session`, and `turn`, `summary` and `by` where there are some. A block keeps the session open; `context` is handed to the host, to put after the opening summary of the next scene.
session-close:
  - name: keep-a-copy
    command: sh /path/to/copy-session.sh

# Just before an agent's earlier turns are compacted. Given `agent`, `reason`, `summary` where one is already written, and `turns`. An answer of {"summary": "..."} stands in place of the summary that would be written; `context` adds after it; a block keeps the carried block as it is.
before-compaction:
  - name: note-the-size
    command: sh /path/to/note-size.sh

# When a job starts, given `job`: `{id, agent, brief}`, and `goesOn` where it goes on from earlier work. `context` goes into the job's brief; a block refuses the job, with the reason. And when it ends, given `job`: `{id, agent}` and `outcome`: `{status, text}`; `context` goes into its report.
job-start:
  - name: job-begun
    command: sh /path/to/job-begun.sh
job-end:
  - name: job-done
    command: sh /path/to/job-done.sh
